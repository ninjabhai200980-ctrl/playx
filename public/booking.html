<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book a Slot</title>
    <link rel="stylesheet" href="/booking.css" />
  </head>
  <body>
    <main class="container">
      <h1>Book a Time Slot</h1>

      <form id="booking-form">
        <label>
          Name
          <input type="text" name="name" id="name" required />
          <span class="field-error" id="name-error" role="alert"></span>
        </label>

        <label>
          Email
          <input type="email" name="email" id="email" required />
          <span class="field-error" id="email-error" role="alert"></span>
        </label>

        <label>
          Password
          <input type="password" name="password" id="password" required minlength="8" />
          <span class="field-error" id="password-error" role="alert"></span>
        </label>

        <label>
          Date
          <input type="date" name="date" id="date" required />
          <span class="field-error" id="date-error" role="alert"></span>
        </label>

        <label>
          Time
          <select name="timeSlot" id="timeSlot" required>
            <option value="">Select a time</option>
          </select>
          <span class="field-error" id="timeSlot-error" role="alert"></span>
        </label>

        <button type="submit" id="submit-btn">Book now</button>
        <p id="status" role="status"></p>
      </form>
    </main>

    <script src="/booking.js"></script>
  </body>
</html>
