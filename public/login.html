<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employee Portal Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <main class="page">
      <section class="intro" aria-hidden="true">
        <span class="badge">Playx Employee Enrollment</span>
        <h1>Welcome back to your benefits hub.</h1>
        <p>
          Sign in to review enrollment status, manage dependents, and keep your
          coverage up to date.
        </p>
      </section>

      <section class="card" aria-labelledby="login-title">
        <h2 id="login-title">Sign in</h2>
        <p>Use your work email to access the portal.</p>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              aria-describedby="email-error"
              placeholder="name@company.com"
            />
            <p class="field-error" id="email-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-group">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                minlength="8"
                aria-describedby="password-error"
                placeholder="Enter your password"
              />
              <button
                class="toggle-btn"
                type="button"
                id="toggle-password"
                aria-pressed="false"
                aria-label="Show password"
              >
                Show
              </button>
            </div>
            <p class="field-error" id="password-error" role="alert"></p>
          </div>

          <div class="actions">
            <button type="submit" id="login-button">Log in</button>
            <p class="status" id="form-status" role="status"></p>
          </div>

          <div class="link">
            <a href="#" aria-label="Recover your password">Forgot password?</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
